<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>部落格 - 陞和姍科技商號 (Sheng & Shan Tech Firm)</title>
    <meta name="description" content="陞和姍科技商號部落格，分享最新 AI 趨勢、企業營運、主管培訓及數位科技文章。">
    <meta name="keywords" content="部落格, AI, 企業顧問, 科技趨勢, 陞和姍科技商號">
    <meta property="og:title" content="部落格 - 陞和姍科技商號 (Sheng & Shan Tech Firm)">
    <meta property="og:description" content="陞和姍科技商號部落格，分享最新 AI 趨勢、企業營運、主管培訓及數位科技文章。">
    <meta property="og:url" content="https://shengshan.tw/blog/index.html">
    <meta property="og:type" content="website">
    <link rel="canonical" href="https://shengshan.tw/blog/">
    <link rel="stylesheet" href="../style.css">
    <link rel="icon" href="../assets/favicon.png" type="image/png">
    <style>
        .blog-list { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .blog-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 25px;
        }
        @media (min-width: 600px) {
            .blog-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (min-width: 1024px) {
            .blog-grid { grid-template-columns: repeat(4, 1fr); }
        }
        .blog-card { 
            display: flex; 
            flex-direction: column; 
            background: white; 
            border-radius: 8px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
            overflow: hidden; 
            transition: transform 0.3s;
            height: 100%;
        }
        .blog-card:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .blog-img { width: 100%; height: 180px; object-fit: cover; }
        .blog-content { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; }
        .blog-content h2 { margin-top: 0; color: var(--primary-color); font-size: 1.25em; line-height: 1.4; margin-bottom: 10px; }
        .blog-meta { font-size: 0.85em; color: #888; margin-bottom: 15px; }
        .blog-content p { 
            color: #555; 
            line-height: 1.6; 
            font-size: 0.95em; 
            margin-bottom: 20px;
            /* Limit text to 4 lines */
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
            flex-grow: 1;
        }
        .read-more { 
            display: inline-block; 
            padding: 8px 15px; 
            background: var(--secondary-color); 
            color: white; 
            text-decoration: none; 
            border-radius: 4px; 
            font-weight: bold; 
            align-self: flex-start;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

<header>
    <nav>
        <a href="/index.html" class="logo-container" style="text-decoration: none;">
            <img src="/assets/logo.png" alt="陞和姍科技商號 Logo">
            <h1>陞和姍科技商號</h1>
        </a>
        <div class="nav-links">
            <div class="dropdown">
                <a href="#" class="dropbtn">產品與服務</a>
                <div class="dropdown-content">
                    <a href="/training.html">主管訓練課程</a>
                    <a href="/ai_employees.html">純AI運營系統</a>
                    <a href="/publishing.html">出版部</a>
                </div>
            </div>
            <a href="/team.html">經營團隊</a>
            <a href="/blog/index.html">部落格</a>
            <a href="/contact.html">聯絡我們</a>
        </div>
    </nav>
</header>

<main class="container blog-list">
    <h1 style="text-align: center; margin-bottom: 40px;">科技與管理部落格</h1>

    <div class="blog-grid">
        {% for post in posts %}
        <article class="blog-card">
            <img src="{{ post.image }}" alt="{{ post.title }}" class="blog-img" loading="lazy">
            <div class="blog-content">
                <h2>{{ post.title }}</h2>
                <div class="blog-meta">作者：{{ post.author }} | 日期：{{ post.date }}</div>
                <p>{{ post.description }}</p>
                <a href="{{ post.id }}.html" class="read-more">閱讀全文</a>
            </div>
        </article>
        {% endfor %}
    </div>

</main>

<footer>
    <p>&copy; 2026 陞和姍科技商號 (Sheng & Shan Tech Firm). All rights reserved.</p>
</footer>

</body>
</html>
