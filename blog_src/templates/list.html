<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>部落格 - 陞和姍科技商號 (Sheng & Shan Tech)</title>
    <meta name="description" content="陞和姍科技商號部落格，分享最新 AI 趨勢、企業營運、主管培訓及數位科技文章。">
    <meta name="keywords" content="部落格, AI, 企業顧問, 科技趨勢, 陞和姍科技商號">
    <meta property="og:title" content="部落格 - 陞和姍科技商號 (Sheng & Shan Tech)">
    <meta property="og:description" content="陞和姍科技商號部落格，分享最新 AI 趨勢、企業營運、主管培訓及數位科技文章。">
    <meta property="og:url" content="https://shengshan.tw/blog/index.html">
    <meta property="og:type" content="website">
    <link rel="canonical" href="https://shengshan.tw/blog/">
    <link rel="stylesheet" href="../style.css">
    <link rel="icon" href="../assets/favicon.png" type="image/png">
    <style>
        .blog-list { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        .blog-card { display: flex; flex-direction: column; background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 30px; overflow: hidden; transition: transform 0.3s; }
        .blog-card:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .blog-img { width: 100%; height: 250px; object-fit: cover; }
        .blog-content { padding: 25px; }
        .blog-content h2 { margin-top: 0; color: var(--primary-color); }
        .blog-content p { color: #555; line-height: 1.6; }
        .blog-meta { font-size: 0.9em; color: #888; margin-bottom: 15px; }
        .read-more { display: inline-block; margin-top: 15px; padding: 8px 15px; background: var(--secondary-color); color: white; text-decoration: none; border-radius: 4px; font-weight: bold; }
        @media (min-width: 768px) {
            .blog-card { flex-direction: row; }
            .blog-img { width: 40%; height: auto; }
            .blog-content { width: 60%; }
        }
    </style>
</head>
<body>

<header>
    <nav>
        <a href="/index.html" class="logo-container" style="text-decoration: none;">
            <img src="/assets/logo.png" alt="陞和姍科技商號 Logo">
            <h1>陞和姍科技商號</h1>
        </a>
        <div class="nav-links">
            <a href="/index.html">首頁</a>
            <a href="/training.html">主管訓練課程</a>
            <a href="/ai_employees.html">建立企業AI員工</a>
            <a href="/team.html">經營團隊</a>
            <a href="/blog/index.html">部落格</a>
            <a href="/contact.html">聯絡我們</a>
        </div>
    </nav>
</header>

<main class="container blog-list">
    <h1 style="text-align: center; margin-bottom: 40px;">科技與管理部落格</h1>

    {% for post in posts %}
    <article class="blog-card">
        <img src="{{ post.image }}" alt="{{ post.title }}" class="blog-img" loading="lazy">
        <div class="blog-content">
            <h2>{{ post.title }}</h2>
            <div class="blog-meta">作者：{{ post.author }} | 日期：{{ post.date }}</div>
            <p>{{ post.description }}</p>
            <a href="{{ post.id }}.html" class="read-more">閱讀全文</a>
        </div>
    </article>
    {% endfor %}

</main>

<footer>
    <p>&copy; 2026 陞和姍科技商號 (Sheng & Shan Tech). All rights reserved.<br><span style="font-size: 14px; opacity: 0.8;">統一編號: 6126 3535</span></p>
</footer>

</body>
</html>
